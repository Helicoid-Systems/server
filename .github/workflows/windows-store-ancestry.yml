name: windows-store-ancestry

# Focused read-only diagnostic only. Does not replace or modify ci.yml.
# Native cargo build/test is intentionally absent from this workflow.
on:
  push:
    paths:
      - 'scripts/diagnose-windows-store-ancestry.ps1'
      - '.github/workflows/windows-store-ancestry.yml'
  workflow_dispatch:

jobs:
  ancestry-diagnostic:
    name: windows-latest ancestry ACL diagnostic
    runs-on: windows-latest
    # Disposable runner; keep the job bounded. Diagnostic only.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ancestry ACL diagnostic
        shell: pwsh
        run: ./scripts/diagnose-windows-store-ancestry.ps1
