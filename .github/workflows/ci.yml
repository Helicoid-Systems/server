name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt / test / clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: server

      - name: Checkout pinned core
        uses: actions/checkout@v4
        with:
          repository: Helicoid-Systems/core
          ref: 5d3f98eaad86330010e1bdaf4731189b286e0dbe
          path: core
          persist-credentials: false

      - name: Validate Linux shell installer and configuration parser
        run: |
          bash -n scripts/install-linux.sh
          bash scripts/install-linux.sh --help
          python3 tests/test_read_linux_install_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt -- --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  macos-plan:
    name: macOS read-only installation plan
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: server

      - name: Checkout pinned core
        uses: actions/checkout@v4
        with:
          repository: Helicoid-Systems/core
          ref: 5d3f98eaad86330010e1bdaf4731189b286e0dbe
          path: core
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test plan, identity, and package custody
        run: >-
          cargo test --locked
          --test installer_macos_plan
          --test installer_macos_launchd
          --test installer_macos_identity
          --test installer_macos_capabilities
          --test installer_package_custody
          --test installer_verified_manifest

  windows:
    name: windows-latest test / build
    runs-on: windows-latest
    # Diagnostic floor so a hung job fails visibly instead of burning the
    # runner; not a capability claim. Windows has no native service installer.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: server

      - name: Checkout pinned core
        uses: actions/checkout@v4
        with:
          repository: Helicoid-Systems/core
          ref: 5d3f98eaad86330010e1bdaf4731189b286e0dbe
          path: core
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt -- --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release
        run: cargo build --locked --release

      - name: Check Windows PowerShell development fixture
        shell: powershell
        run: ./scripts/check-development-fixture.ps1

      - name: Check PowerShell 7 development fixture
        shell: pwsh
        run: ./scripts/check-development-fixture.ps1

      - name: Stage development download bundle
        shell: pwsh
        run: |
          $out = 'artifacts/hs-server-windows-x64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'target/release/hs-server.exe' $out
          Copy-Item 'scripts/start-development.ps1' $out
          Copy-Item 'scripts/start-development.cmd' $out
          Copy-Item 'scripts/windows-tester.md' $out
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload development download bundle
        uses: actions/upload-artifact@v4
        with:
          name: hs-server-windows-x64-dev
          path: server/artifacts/hs-server-windows-x64/
          if-no-files-found: error
          retention-days: 14
