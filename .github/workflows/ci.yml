name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt / test / clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt -- --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  windows:
    name: windows-latest test / build
    runs-on: windows-latest
    # Diagnostic floor so a hung job fails visibly instead of burning the
    # runner; not a capability claim. Windows has no native service installer.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt -- --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release
        run: cargo build --locked --release

      - name: Check Windows PowerShell development fixture
        shell: powershell
        run: ./scripts/check-development-fixture.ps1

      - name: Check PowerShell 7 development fixture
        shell: pwsh
        run: ./scripts/check-development-fixture.ps1

      - name: Stage development download bundle
        shell: pwsh
        run: |
          $out = 'artifacts/hs-server-windows-x64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'target/release/hs-server.exe' $out
          Copy-Item 'scripts/start-development.ps1' $out
          Copy-Item 'scripts/start-development.cmd' $out
          Copy-Item 'scripts/windows-tester.md' $out
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload development download bundle
        uses: actions/upload-artifact@v4
        with:
          name: hs-server-windows-x64-dev
          path: artifacts/hs-server-windows-x64/
          if-no-files-found: error
          retention-days: 14
